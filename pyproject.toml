[project]
name = "rewardshield"
version = "0.1.0"
description = "Test-database verifiers for SQL agent rewards: single vs random vs mutation-guided"
requires-python = ">=3.12"
dependencies = [
    "agenttune==1.1.5",
    "auditkit[jsonschema]==1.1.11",
    "nltk==3.10.4",
    "sqlglot==30.31.0",
    "sqlparse==0.6.1",
]


[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest==9.2.0",
]
